[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tantalus-hoard"
version = "0.1.0"
description = "A local product watcher: restocks, price drops, pre-orders, second-hand finds and news, with a dashboard, notifications and MCP tools."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Luissalet" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
  "mcp>=1.10,<2",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
windows = ["winotify>=1.1"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
icon = ["pillow>=11", "numpy>=2"]

[project.scripts]
tantalus-hoard = "tantalus_hoard.__main__:main"

[tool.setuptools.packages.find]
include = ["tantalus_hoard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning", "ignore::FutureWarning"]
